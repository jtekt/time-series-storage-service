version: "3.6"

services:

  influxdb:
    logging:
      driver: none
    image: influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: exampleuser
      DOCKER_INFLUXDB_INIT_PASSWORD: examplepassword
      DOCKER_INFLUXDB_INIT_ORG: example-organization
      DOCKER_INFLUXDB_INIT_BUCKET: example-bucket
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: example-token
    volumes:
      - /var/lib/influxdb2

  time-series-storage:
    image: public.ecr.aws/jtekt-corporation/time-series-storage-service:latest
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: example-token
      INFLUXDB_ORG: example-organization
      INFLUXDB_BUCKET: example-bucket
    ports:
      - 7070:80

